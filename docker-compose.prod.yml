services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Relational Store
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dr_cdss_db_prod
    restart: always
    env_file: .env.production
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dr_network_prod

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: dr_cdss_backend_prod
    restart: always
    env_file: .env.production
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Ensure connection uses the docker network host 'db'
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # Mount only persistent storage volumes, code is baked into the image
      - storage_prod:/app/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dr_network_prod

  # ----------------------------------------------------------------------------
  # Vite + React 18 Frontend Service (Served via Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: dr_cdss_frontend_prod
    restart: always
    ports:
      # Expose Nginx on local port 3350 (Spacehubtech reverse proxy routes drai-cdss.spacehubtech.cloud to this)
      - "127.0.0.1:${HOST_PORT:-3350}:80"
    depends_on:
      - backend
    networks:
      - dr_network_prod

# ------------------------------------------------------------------------------
# Persistent Storage Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data_prod:
    driver: local
  storage_prod:
    driver: local

networks:
  dr_network_prod:
    driver: bridge
