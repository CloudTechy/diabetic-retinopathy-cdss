name: Evidence Integrity Gate

# The Chapter Four evidence package was once fabricated, passed an internal
# review, and was caught only by an external examiner. This workflow is the
# mechanical guard against that recurring: it runs on every push and every pull
# request, and a failure blocks the change.
#
# It is deliberately cheap - no dataset, no GPU, no PyTorch - so there is no
# excuse to skip it.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  integrity-gate:
    name: Evidence integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the minimum needed to read the evidence
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest pydantic pydantic-settings numpy pillow

      - name: Evidence integrity gate
        working-directory: backend
        env:
          AI_INFERENCE_ENGINE: mock
        run: |
          # --noconftest is load-bearing, not a convenience.
          #
          # tests/conftest.py imports the whole application stack -
          # pytest_asyncio, aiosqlite, SQLAlchemy async, FastAPI - which this
          # job deliberately does not install, because the rules below are
          # static analysis over committed files and need none of it. Without
          # the flag pytest fails at conftest IMPORT and exits 4 before running
          # a single rule. That is what happened: the gate guarding every
          # evidence claim had not executed in CI for several merges, reporting
          # "fail" for a missing module rather than for anything it detects.
          #
          # If a rule ever needs an application fixture, install the
          # dependencies in the step above - do not drop this flag and leave
          # the job unable to collect.
          python -m pytest \
            tests/test_editor_integrity_gate.py \
            tests/test_spec_doc_consistency.py \
            --noconftest \
            -v --tb=short

      - name: Recompute the reported metrics from the raw predictions
        run: python backend/scripts/analyze_clinical_metrics.py

      - name: Confirm the submission package matches its source artefacts
        run: python backend/scripts/assemble_submission_package.py --check

  full-suite:
    name: Full backend suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r backend/requirements.txt
          python -m pip install --quiet pytest pytest-asyncio aiosqlite

      - name: Run tests
        working-directory: backend
        env:
          AI_INFERENCE_ENGINE: mock
        run: python -m pytest tests/ -q
